# Present Configuration File
# This file controls how Present calculates karma scores and filters libraries

# Two-Tier Ranking System
# Tier 1: Battle-Tested (actual usage in repos)
# Tier 2: Under Evaluation (bookmarked in star lists)

# Tier 1: Karma scoring weights for production usage (must sum to 1.0)
tier1_karma_weights:
  usage_frequency: 0.5      # Weight for repository usage counts
  star_count: 0.3           # Weight for GitHub stars
  recent_activity: 0.2      # Weight for recent commits/releases

# Tier 2: Karma scoring weights for evaluation/bookmarks (must sum to 1.0)
tier2_karma_weights:
  star_list_inclusions: 0.5  # How many users bookmarked it
  star_list_diversity: 0.3   # Breadth across different users
  emergence_velocity: 0.2    # Rate of new bookmarks

# Tier promotion threshold
# Libraries graduate from Tier 2 to Tier 1 when they reach this usage count
tier_promotion_threshold:
  min_repo_usage: 50        # Minimum repositories using the library

# Update frequency
update_schedule:
  interval: "daily"         # Options: hourly, daily, weekly
  timezone: "UTC"

# Privacy-aware deny patterns
# Libraries matching these patterns will be excluded from ranking
deny_patterns:
  # Internal organization libraries
  - "internal-*"
  - "*-internal"
  - "company-*"

  # Private organization namespaces
  - "@myorg/*"
  - "@company/*"
  - "*/private-*"

  # Local-only dependencies
  - "*.local"
  - "local-*"
  - "localhost-*"

  # Testing and development only
  - "test-*"
  - "*-test-util"
  - "dev-*"

  # Proprietary patterns (example)
  - "proprietary/*"
  - "*/enterprise-internal"

# Minimum thresholds to be included in rankings
thresholds:
  min_stars: 10             # Minimum GitHub stars
  min_usage_count: 5        # Minimum repository usage count
  min_age_days: 7           # Minimum library age in days

# Repository inclusion/exclusion for usage counting (Tier 1)
repository_filters:
  # Include both public and private repos for usage counting
  include_public: true
  include_private: true

  # Exclude certain repository patterns from usage counting
  exclude_repos:
    - "*/test-*"            # Test repositories
    - "*/demo-*"            # Demo repositories
    - "*/example-*"         # Example repositories
    - "*/archive-*"         # Archived repositories

# Star list data sources (Tier 2)
star_list_config:
  # GitHub star lists to aggregate (format: github.com/stars/username/lists/list-name)
  # Example: github.com/stars/ninyawee/lists/present-python

  # Minimum star list criteria
  min_list_stars: 3         # Minimum stars on the list itself
  min_list_items: 5         # Minimum items in the list

  # List name patterns to include (case-insensitive)
  list_name_patterns:
    - "*present*"           # Lists with "present" in name
    - "*awesome*"           # Lists with "awesome" in name
    - "*python*"            # Language-specific lists
    - "*bookmark*"          # Bookmark lists
    - "*to-try*"            # Evaluation lists
    - "*watching*"          # Watchlist lists

  # Exclude certain users' star lists (privacy/spam)
  exclude_users:
    - "bot-*"               # Bot accounts
    - "*-crawler"           # Crawlers

# Data collection settings
data_collection:
  # Anonymize usage data
  anonymize_private_repos: true

  # Retention period for historical data
  retention_days: 365

  # API rate limiting
  github_api_rate_limit: 5000  # Requests per hour

# Display settings
display:
  # Show trending indicators
  show_trending: true

  # Number of libraries to display per tier per category
  tier1_items_per_category: 50    # Battle-tested libraries
  tier2_items_per_category: 30    # Under evaluation libraries

  # Tier display settings
  tier_badges:
    tier1: "🔥 Tier 1: Battle-Tested"
    tier2: "🌟 Tier 2: Under Evaluation"

  # Show metadata for each library
  show_metadata:
    tier_badge: true
    karma_score: true
    usage_count: true             # For Tier 1
    star_list_count: true         # For Tier 2
    star_count: true
    last_updated: true
    trending_indicator: true

  # Trending indicator thresholds (change from last week)
  trending_thresholds:
    rising: 5                     # +5% or more
    falling: -5                   # -5% or less
    stable: [-4, 4]               # Between -4% and +4%
