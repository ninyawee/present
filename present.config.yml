# Present Configuration File
# Federated, usage-driven rankings that ignore GitHub stars

# Architecture Level
# Determines the scope of data aggregation
architecture:
  level: "org"              # Options: org, community, global
  org_name: "ninyawee"      # Your GitHub org/username
  community_name: null      # For federated: "thailand", "asia", etc.

  # For federated aggregation (e.g., present/thailand-present-python)
  # List orgs/users to include in the federation
  federated_sources: []
    # - "ninyawee"
    # - "other-thai-org"
    # - "another-user"

# Time Windows
# Define time periods for usage analysis
time_windows:
  recent: 90                # 3 months in days
  established: 365          # 1 year
  mature: 1095              # 3 years
  legacy: 1825              # 5 years

# Tier 1: Battle-Tested (Project Count Ranking)
# Stars are IGNORED - only project count matters
tier1_karma:
  # Recency multipliers - recent usage counts more
  recency_weights:
    recent: 1.5             # 3 months: highest weight
    established: 1.2        # 1 year: good weight
    mature: 1.0             # 3 years: baseline
    legacy: 0.8             # 5 years: discounted (might be outdated)

  # Formula: karma = project_count × recency_weight
  # Example: 1000 projects (3 months) = 1000 × 1.5 = 1500 karma
  #          1000 projects (5 years)  = 1000 × 0.8 = 800 karma

# Tier 2: Under Evaluation (Star List Ranking)
tier2_karma:
  weights:
    star_list_count: 0.5    # How many users bookmarked it
    diversity: 0.3          # Breadth across different users
    emergence_rate: 0.2     # Growth rate in bookmarks

  # Diversity calculation
  # 10 bookmarks from 10 users > 10 bookmarks from 1 user
  diversity_formula: "unique_users / total_bookmarks"

# Tier promotion threshold
# Libraries graduate from Tier 2 to Tier 1 when used in projects
tier_promotion:
  min_projects: 5           # Minimum projects using it (org level)
  min_projects_federated: 50  # Minimum for federated level

# Update frequency
update_schedule:
  interval: "daily"         # Options: hourly, daily, weekly
  timezone: "UTC"

# Privacy-aware deny patterns
# Libraries matching these patterns will be excluded from ranking
deny_patterns:
  # Internal organization libraries
  - "internal-*"
  - "*-internal"
  - "company-*"

  # Private organization namespaces
  - "@myorg/*"
  - "@company/*"
  - "*/private-*"

  # Local-only dependencies
  - "*.local"
  - "local-*"
  - "localhost-*"

  # Testing and development only
  - "test-*"
  - "*-test-util"
  - "dev-*"

  # Proprietary patterns (example)
  - "proprietary/*"
  - "*/enterprise-internal"

# Minimum thresholds to be included in rankings
# Stars are NOT a threshold - only actual usage matters
thresholds:
  tier1_min_projects: 3     # Minimum projects using it (org level)
  tier1_min_projects_federated: 10  # Minimum for federated
  tier2_min_star_lists: 2   # Minimum star list inclusions
  min_age_days: 7           # Minimum library age in days

# Repository inclusion/exclusion for usage counting (Tier 1)
repository_filters:
  # Include both public and private repos for usage counting
  include_public: true
  include_private: true

  # Exclude certain repository patterns from usage counting
  exclude_repos:
    - "*/test-*"            # Test repositories
    - "*/demo-*"            # Demo repositories
    - "*/example-*"         # Example repositories
    - "*/archive-*"         # Archived repositories

# Star list data sources (Tier 2)
star_list_config:
  # GitHub star lists to aggregate (format: github.com/stars/username/lists/list-name)
  # Example: github.com/stars/ninyawee/lists/present-python

  # Minimum star list criteria
  min_list_stars: 3         # Minimum stars on the list itself
  min_list_items: 5         # Minimum items in the list

  # List name patterns to include (case-insensitive)
  list_name_patterns:
    - "*present*"           # Lists with "present" in name
    - "*awesome*"           # Lists with "awesome" in name
    - "*python*"            # Language-specific lists
    - "*bookmark*"          # Bookmark lists
    - "*to-try*"            # Evaluation lists
    - "*watching*"          # Watchlist lists

  # Exclude certain users' star lists (privacy/spam)
  exclude_users:
    - "bot-*"               # Bot accounts
    - "*-crawler"           # Crawlers

# Data collection settings
data_collection:
  # Anonymize usage data
  anonymize_private_repos: true

  # Retention period for historical data
  retention_days: 365

  # API rate limiting
  github_api_rate_limit: 5000  # Requests per hour

# Display settings
display:
  # Default time window to display
  default_time_window: "recent"   # Options: recent, established, mature, legacy

  # Show multiple time windows for comparison
  show_time_comparison: true      # Show usage across all time windows

  # Number of libraries to display per tier per category
  tier1_items_per_category: 50    # Battle-tested libraries
  tier2_items_per_category: 30    # Under evaluation libraries

  # Tier display settings
  tier_badges:
    tier1: "🔥 Tier 1: Battle-Tested"
    tier2: "🌟 Tier 2: Under Evaluation"

  # Show metadata for each library
  # IMPORTANT: Stars are NOT shown - they're irrelevant
  show_metadata:
    tier_badge: true
    project_count: true           # For Tier 1 - how many projects use it
    star_list_count: true         # For Tier 2 - how many users bookmarked it
    time_window: true             # Which time window (3mo, 1yr, 3yr, 5yr)
    trend_indicator: true         # Rising/falling/stable
    scope: true                   # Org / Community / Global
    show_stars: false             # Stars are IGNORED

  # Trending indicator thresholds (change from previous time window)
  trending_thresholds:
    rising: 10                    # +10% or more project count
    falling: -10                  # -10% or less
    stable: [-9, 9]               # Between -9% and +9%
